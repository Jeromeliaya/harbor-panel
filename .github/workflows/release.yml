name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          latest_tag="$(gh release list --limit 100 --json tagName,isDraft,isPrerelease \
            --jq '[.[] | select(.isDraft == false and .isPrerelease == false)
              | .tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | .[0] // ""')"

          if [ -n "$latest_tag" ] && git merge-base --is-ancestor "$RELEASE_SHA" "$latest_tag"; then
            echo "This commit has already been released; nothing to publish."
            exit 0
          fi

          export LATEST_TAG="$latest_tag"
          export NOTES_FILE="$RUNNER_TEMP/harbor-release-notes.md"
          next_tag="$(python - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          latest = os.environ["LATEST_TAG"]
          sha = os.environ["RELEASE_SHA"]
          if latest:
              major, minor, patch = (int(part) for part in latest[1:].split("."))
              version = f"v{major}.{minor}.{patch + 1}"
          else:
              version = "v0.1.0"

          revision = f"{latest}..{sha}" if latest else sha
          subjects = subprocess.check_output(
              ["git", "log", "--reverse", "--format=%s (%h)", revision],
              encoding="utf-8",
          ).splitlines()
          changes = "\n".join(f"- {subject}" for subject in subjects)
          repo_url = f"https://github.com/{os.environ['GH_REPO']}"
          changelog = f"{repo_url}/compare/{latest}...{version}" if latest else f"{repo_url}/commits/{version}"
          Path(os.environ["NOTES_FILE"]).write_text(
              f"## 本次更新\n\n{changes}\n\n**完整改动**：{changelog}\n",
              encoding="utf-8",
          )
          print(version)
          PY
          )"

          gh release create "$next_tag" \
            --target "$RELEASE_SHA" \
            --title "Harbor Panel $next_tag" \
            --notes-file "$NOTES_FILE"
